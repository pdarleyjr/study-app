<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18264b">
  <meta name="robots" content="noindex">
  <title>Page not found — Study Quest</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;color:#18264b;background:linear-gradient(145deg,#fbf5ff,#f1f8ff 54%,#fff9ed);text-align:center}
    main{max-width:520px}
    .big{font-size:4.5rem;margin:0}
    h1{font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.03em;margin:8px 0 10px}
    p{color:#5c6680;font-weight:650;line-height:1.6;margin:0 0 24px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:13px 22px;border-radius:14px;background:#18264b;color:#fff;font-weight:900;text-decoration:none;box-shadow:0 4px 0 #0b1532;touch-action:manipulation}
    a:focus-visible{outline:4px solid #d89800;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="big" aria-hidden="true">🧭</p>
    <h1>Oops! This page got lost.</h1>
    <p>The link you opened does not lead to a study game. Head back to the Study Quest home page to pick a game.</p>
    <a id="home" href="/">Back to Study Quest</a>
  </main>
  <script>
    /* On a GitHub Pages project site the first part of the path is the repository name. */
    (function () {
      var seg = location.pathname.split("/")[1];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById("home").href = "/" + seg + "/";
    })();
  </script>
</body>
</html>
