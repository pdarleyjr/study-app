<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Study Quest">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <script defer src="../assets/app.js"></script>
    <title>Padre Nuestro - Multiple Choice Quiz Arcade</title>
    <style>
        :root {
            --primary: #4338CA;
            --primary-light: #EEF2FF;
            --accent: #F59E0B;
            --success: #10B981;
            --danger: #EF4444;
            --bg-page: #6366F1;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
        }

        /* Buttons should not get selected by accident; text stays selectable. */
        button {
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        :where(button, a):focus-visible {
            outline: 4px solid #FBBF24;
            outline-offset: 3px;
        }

        [tabindex="-1"]:focus {
            outline: none;
        }

        .vh {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .shell {
            width: 100%;
            max-width: 640px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding: 10px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.95);
            color: #312E81;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
        }

        body {
            font-family: ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            margin: 0;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-dark);
        }

        .arcade-card {
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            padding: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Mode Switcher */
        .mode-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .nav-btn {
            min-height: 64px;
            background: #F1F5F9;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 10px 4px;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .nav-btn .icon {
            font-size: 1.35rem;
        }

        .nav-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(67, 56, 202, 0.35);
            transform: translateY(-2px);
        }

        /* Header / Stats */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .mode-title {
            font-family: ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 1.3rem;
            color: var(--text-dark);
            margin: 0;
        }

        .score-badge {
            background: #FEF3C7;
            color: #92400E;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 8px;
            background: #E2E8F0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Box */
        .question-box {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 20px;
            padding: 22px 18px;
            text-align: center;
            margin-bottom: 18px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .q-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 800;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .q-text {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.45;
        }

        .blank-space {
            color: var(--primary);
            text-decoration: underline;
            padding: 0 4px;
            font-weight: 900;
        }

        /* Multiple Choice Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .mc-btn {
            background: white;
            border: 2px solid #CBD5E1;
            box-shadow: 0 3px 0 #94A3B8;
            border-radius: 16px;
            min-height: 60px;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-dark);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.1s ease;
        }

        .mc-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #94A3B8;
        }

        .mc-letter {
            background: #F1F5F9;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        /* Visual Feedback States (No Sound) */
        .mc-btn.correct {
            background: #D1FAE5 !important;
            border-color: var(--success) !important;
            box-shadow: 0 3px 0 #059669 !important;
            color: #065F46 !important;
        }

        .mc-btn.correct .mc-letter {
            background: var(--success);
            color: white;
        }

        .mc-btn.wrong {
            background: #FEE2E2 !important;
            border-color: var(--danger) !important;
            box-shadow: 0 3px 0 #DC2626 !important;
            color: #991B1B !important;
        }

        .mc-btn.wrong .mc-letter {
            background: var(--danger);
            color: white;
        }

        .shake {
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* Next Button */
        .bottom-action {
            display: flex;
            justify-content: flex-end;
            min-height: 48px;
        }

        .next-btn {
            min-height: 54px;
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 3px 0 #312E81;
            padding: 12px 26px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            display: none;
        }

        .next-btn.show {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .next-btn.alt {
            background: #EEF2FF;
            color: #312E81;
            box-shadow: 0 3px 0 #C7D2FE;
            border: 2px solid #C7D2FE;
        }

        .report-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .report-actions a {
            text-decoration: none;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #312E81;
        }

        /* Report Card (For Game 4) */
        .report-card {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }

        .grade-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #FEF3C7;
            border: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px auto;
        }

        .grade-letter {
            font-family: ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 2.8rem;
            color: #92400E;
            line-height: 1;
        }

        .grade-score {
            font-size: 0.9rem;
            font-weight: 900;
            color: #B45309;
        }

        @media (min-width: 768px) {
            .arcade-card { padding: 32px; }
            .q-text { font-size: 1.55rem; }
            .mc-btn { font-size: 1.15rem; }
            .nav-btn { font-size: 0.95rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        /* Confetti Overlay */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<main class="shell">
<a class="back-link" href="../">← Study Quest home</a>
<h1 class="vh">Padre Nuestro quiz arcade</h1>

<div class="arcade-card">
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>

    <!-- Game Navigation -->
    <nav class="mode-nav" aria-label="Choose a game">
        <button type="button" class="nav-btn active" data-mode="fill" aria-pressed="true">
            <span class="icon" aria-hidden="true">🔍</span>Blanks
        </button>
        <button type="button" class="nav-btn" data-mode="sequence" aria-pressed="false">
            <span class="icon" aria-hidden="true">➡️</span>Next Line
        </button>
        <button type="button" class="nav-btn" data-mode="meaning" aria-pressed="false">
            <span class="icon" aria-hidden="true">🌐</span>Meaning
        </button>
        <button type="button" class="nav-btn" data-mode="exam" aria-pressed="false">
            <span class="icon" aria-hidden="true">📝</span>Test Mode
        </button>
    </nav>

    <!-- Top Status Bar -->
    <div class="quiz-header">
        <h2 class="mode-title" id="modeTitle" tabindex="-1">Missing Word</h2>
        <div class="score-badge">⭐ Score: <span id="scoreDisplay">0</span></div>
    </div>

    <!-- Progress Tracker -->
    <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- Quiz Question Area -->
    <div id="quizContent">
        <div class="question-box" id="questionBox" tabindex="-1">
            <div class="q-sub" id="qSub">Question 1</div>
            <div class="q-text" id="qPrompt">Loading...</div>
        </div>

        <!-- Multiple Choice Options -->
        <div class="options-list" id="optionsList"></div>

        <!-- Next Question Button -->
        <div class="bottom-action">
            <button type="button" class="next-btn" id="nextBtn">Next Question ➔</button>
        </div>
    </div>

    <!-- Final Test Report Card -->
    <div class="report-card" id="reportCard">
        <div class="grade-circle">
            <div class="grade-letter" id="reportGrade">A+</div>
            <div class="grade-score" id="reportScore">10 / 10</div>
        </div>
        <h2 style="font-family: ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0 0 8px 0;" id="reportMsg">Super Star!</h2>
        <p style="color: var(--text-muted); font-weight: 800; margin-bottom: 24px;" id="reportSub">You are totally ready for the test!</p>
        <div class="report-actions">
            <button type="button" class="next-btn show" id="againBtn">Play again 🔄</button>
            <button type="button" class="next-btn alt show" id="testBtn">Try the Practice Test 📝</button>
            <a class="next-btn alt show" href="../">Back to home</a>
        </div>
    </div>

</div>
</main>

<script>
    // Master database of the Spanish Our Father
    const PRAYER_LINES = [
        "Padre nuestro, que estás en el cielo,",
        "santificado sea tu Nombre;",
        "venga a nosotros tu reino;",
        "hágase tu voluntad en la tierra como en el cielo.",

        "como también nosotros perdonamos a los que nos ofenden;",
        "no nos dejes caer en la tentación,",
        "y líbranos del mal. Amén."
    ];

    // 1. Fill-In-The-Blank Database
    const fillQuestions = [
        {
            q: "Padre nuestro, que estás en el <span class='blank-space'>______</span>,",

            options: ["tierra", "luna", "noche", "vida"]
        },
        {
            q: "Danos hoy nuestro <span class='blank-space'>______</span> de cada día;",
            correct: "pan",
            options: ["agua", "sol", "pan", "reino"]
        },
        {
            q: "perdona nuestras <span class='blank-space'>______</span>,",
            correct: "ofensas",
            options: ["manos", "ofensas", "palabras", "tierras"]
        },
        {
            q: "como también nosotros perdonamos a los que nos <span class='blank-space'>______</span>;",
            correct: "ofenden",
            options: ["llaman", "miran", "ofenden", "cantan"]
        },
        {
            q: "no nos dejes caer en la <span class='blank-space'>______</span>,",
            correct: "tentación",

    // 2. Next Line Database
    const sequenceQuestions = [
        {
            prompt: "What line comes immediately AFTER:<br><b>« Padre nuestro, que estás en el cielo, »</b>",
            correct: "santificado sea tu Nombre;",
            options: [
                "santificado sea tu Nombre;",
                "venga a nosotros tu reino;",
                "Danos hoy nuestro pan de cada día;"
            ]
        },
        {

            correct: "venga a nosotros tu reino;",

                "hágase tu voluntad en la tierra...",
                "venga a nosotros tu reino;",
                "perdona nuestras ofensas,"
            ]
        },
        {
            prompt: "What line comes immediately AFTER:<br><b>« venga a nosotros tu reino; »</b>",
            correct: "hágase tu voluntad en la tierra como en el cielo.",
            options: [
                "hágase tu voluntad en la tierra como en el cielo.",
                "y líbranos del mal. Amén.",
                "Danos hoy nuestro pan de cada día;"
            ]
        },
        {
            prompt: "What line comes immediately AFTER:<br><b>« hágase tu voluntad en la tierra como en el cielo. »</b>",
            correct: "Danos hoy nuestro pan de cada día;",
            options: [
                "no nos dejes caer en la tentación,",
                "perdona nuestras ofensas,",
                "Danos hoy nuestro pan de cada día;"
            ]
        },
        {
            prompt: "What line comes immediately AFTER:<br><b>« Danos hoy nuestro pan de cada día; »</b>",
            correct: "perdona nuestras ofensas,",
            options: [
                "santificado sea tu Nombre;",
                "perdona nuestras ofensas,",
                "como también nosotros perdonamos..."
            ]
        },
        {
            prompt: "What line comes immediately AFTER:<br><b>« perdona nuestras ofensas, »</b>",
            correct: "como también nosotros perdonamos a los que nos ofenden;",
            options: [

                "y líbranos del mal. Amén."

                "santificado sea tu Nombre;",
                "y líbranos del mal. Amén."

    // 3. Meaning Match Database (English to Spanish)
    const meaningQuestions = [
        {
            prompt: "Which Spanish line means:<br><b>\"Our Father, who art in heaven\"</b>?",
            correct: "Padre nuestro, que estás en el cielo,",
            options: [

    // 4. Practice Exam Database (Curated 10 Questions)
    const examQuestions = [
        {
            q: "What is the very first line of the prayer?",
            correct: "Padre nuestro, que estás en el cielo,",
            options: [

            options: ["Cielo", "Nombre", "Pan"]

        {
            q: "Which word completes this line?<br>« venga a nosotros tu <span class='blank-space'>______</span>; »",

        },
        {
            q: "Fill in the blank:<br>« Danos hoy nuestro <span class='blank-space'>______</span> de cada día; »",
            correct: "pan",
            options: ["pan", "cielo", "nombre"]
        },
        {
            q: "What line comes after « Danos hoy nuestro pan de cada día; »?",
            correct: "perdona nuestras ofensas,",
            options: [
                "y líbranos del mal. Amén.",
                "perdona nuestras ofensas,",
                "no nos dejes caer en la tentación,"
            ]
        },
        {
            q: "Which word completes the blank?<br>« como también nosotros perdonamos a los que nos <span class='blank-space'>______</span>; »",
            correct: "ofenden",
            options: ["ofenden", "llaman", "salvan"]
        },
        {
            q: "Fill in the blank:<br>« no nos dejes caer en la <span class='blank-space'>______</span>, »",
            correct: "tentación",
            options: ["tierra", "tentación", "mentira"]
        },
        {
            q: "What is the final line of the prayer?",
            correct: "y líbranos del mal. Amén.",
            options: [
                "y líbranos del mal. Amén.",

    // Fair shuffle (Fisher-Yates) so every order is equally likely
    function shuffle(list) {
        const a = [...list];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const live = document.getElementById('live');
    function announce(text) { live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); }

    // State Variables
    let currentMode = 'fill';
    let currentPool = [];
    let qIndex = 0;
    let score = 0;
    let answered = false;

    function loadMode(mode) {
        currentMode = mode;
        qIndex = 0;
        score = 0;
        answered = false;
        document.getElementById('scoreDisplay').innerText = score;

        // Nav tabs highlight
        document.querySelectorAll('.nav-btn').forEach(b => {
            const on = b.dataset.mode === mode;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', String(on));
        });

        document.getElementById('quizContent').style.display = 'block';
        document.getElementById('reportCard').style.display = 'none';

        if (mode === 'fill') {
            document.getElementById('modeTitle').innerText = "🔍 Missing Word";
            currentPool = shuffle(fillQuestions);
        } else if (mode === 'sequence') {
            document.getElementById('modeTitle').innerText = "➡️ What Comes Next?";
            currentPool = shuffle(sequenceQuestions);
        } else if (mode === 'meaning') {
            document.getElementById('modeTitle').innerText = "🌐 Meaning Match";
            currentPool = shuffle(meaningQuestions);
        } else if (mode === 'exam') {
            document.getElementById('modeTitle').innerText = "📝 Practice Test";
            currentPool = [...examQuestions]; // Set order for test
        }

        renderQuestion();
    }

    function startMode(mode) {
        loadMode(mode);
        document.getElementById('modeTitle').focus({ preventScroll: true });
    }

    function setProgress(percent) {
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressTrack').setAttribute('aria-valuenow', String(Math.round(percent)));
    }

    function renderQuestion() {
        answered = false;
        document.getElementById('nextBtn').classList.remove('show');
        
        const qData = currentPool[qIndex];
        const progressPercent = ((qIndex) / currentPool.length) * 100;
        setProgress(progressPercent);

        document.getElementById('qSub').innerText = `Question ${qIndex + 1} of ${currentPool.length}`;
        
        // Handle question text
        const promptEl = document.getElementById('qPrompt');
        promptEl.innerHTML = qData.q || qData.prompt;

        // Build Multiple Choice options
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';

        // Shuffle options so the correct answer isn't predictable
        const letters = ['A', 'B', 'C', 'D'];
        const shuffledOptions = shuffle(qData.options);

        shuffledOptions.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mc-btn';
            btn.dataset.answer = optText;
            btn.innerHTML = `
                <span class="mc-letter" aria-hidden="true">${letters[i]}</span>
                <span style="flex-grow: 1;">${optText}</span>
            `;
            btn.addEventListener('click', () => selectOption(btn, optText, qData.correct));
            optionsList.appendChild(btn);
        });
    }

    function selectOption(clickedBtn, selectedText, correctText) {
        if (answered) return;
        answered = true;

        const allButtons = document.querySelectorAll('.mc-btn');
        allButtons.forEach(b => b.style.pointerEvents = 'none');

        const mark = (b, good) => {
            b.classList.add(good ? 'correct' : 'wrong');
            b.querySelector('.mc-letter').textContent = good ? '✓' : '✕';
        };

        if (selectedText === correctText) {
            mark(clickedBtn, true);
            score += 10;
            document.getElementById('scoreDisplay').innerText = score;
            triggerConfetti();
            announce('Correct! Great job.');
        } else {
            mark(clickedBtn, false);
            const card = document.querySelector('.arcade-card');
            if (!reduceMotion.matches) {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }

            // Highlight the right one so he immediately learns
            allButtons.forEach(b => {
                if (b.dataset.answer === correctText) mark(b, true);
            });
            announce('Not quite. The correct answer is ' + correctText.replace(/<[^>]*>/g, '') + '.');
        }

        const next = document.getElementById('nextBtn');
        next.textContent = qIndex < currentPool.length - 1 ? 'Next Question ➔' : 'See my score ➔';
        next.classList.add('show');
        next.focus({ preventScroll: true });
    }

    function nextQuestion() {
        if (qIndex < currentPool.length - 1) {
            qIndex++;
            renderQuestion();
        } else {
            showFinalScreen();
        }
    }

    function showFinalScreen() {
        setProgress(100);
        triggerConfetti();

        document.getElementById('quizContent').style.display = 'none';
        const report = document.getElementById('reportCard');
        report.style.display = 'block';

        const maxScore = currentPool.length * 10;
        const percentage = Math.round((score / maxScore) * 100);
        document.getElementById('reportScore').innerText = `${score / 10} / ${currentPool.length}`;

        const gradeLetter = document.getElementById('reportGrade');
        const msg = document.getElementById('reportMsg');
        const sub = document.getElementById('reportSub');

        if (percentage >= 90) {
            gradeLetter.innerText = "A+";
            msg.innerText = "🏆 Excellent job!";
            sub.innerText = currentMode === 'exam' ? "You have memorized the prayer in Spanish!" : "You really know this one. Try the Practice Test next!";
        } else if (percentage >= 70) {
            gradeLetter.innerText = "B";
            msg.innerText = "👍 Great effort!";
            sub.innerText = "You almost have it down 100%! Play again to get there.";
        } else {
            gradeLetter.innerText = "C";
            msg.innerText = "💪 Keep practicing!";
            sub.innerText = "Try the 'Blanks' game to review the words, then come back.";
        }
        announce(`${msg.innerText} You got ${score / 10} out of ${currentPool.length}.`);
        if (window.StudyQuest) StudyQuest.record('spanish', percentage);
        msg.setAttribute('tabindex', '-1');
        msg.focus({ preventScroll: true });
    }

    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => startMode(b.dataset.mode)));
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('againBtn').addEventListener('click', () => startMode(currentMode));
    document.getElementById('testBtn').addEventListener('click', () => startMode('exam'));

    // ==========================================
    // ZERO-SOUND VISUAL CONFETTI CANNON
    // ==========================================
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function triggerConfetti() {
        if (reduceMotion.matches) return;
        resizeCanvas();
        particles = [];
        const colors = ['#10B981', '#6366F1', '#F59E0B', '#EC4899', '#3B82F6'];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height * 0.4,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.7) * 10,
                size: Math.random() * 7 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1
            });
        }
        requestAnimationFrame(renderConfetti);
    }

    function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25; // gravity
            p.alpha -= 0.025;

            if (p.alpha > 0) {
                active = true;
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        });

        if (active) requestAnimationFrame(renderConfetti);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Launch initial mode
    loadMode('fill');
    resizeCanvas();
</script>

</body>
